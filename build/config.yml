# This file contains the configuration for this project.
# When you update `info` or `fileAssociations`, run `wails3 task common:update:build-assets` to update the assets.
version: '3'

info:
  companyName: "Z"
  productName: "ZServerBackup"
  productIdentifier: "com.z.serverbackuptools"
  description: "远程 Windows 分卷 zip 流水线备份客户端"
  copyright: "(c) 2026, Z"
  comments: "SFTP zip backup pipeline client"
  version: "1.0.9"

# 前端改动由 Vite HMR 热更新（不关窗口）；仅 Go 改动才重建并重启应用
dev_mode:
  root_path: .
  log_level: info
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - dist
      - bin
      - .task
      - build
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 task common:install:frontend:deps
      type: once
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task build DEV=true
      type: blocking
    - cmd: scripts\dev-run-app.bat
      type: primary

fileAssociations: []

other:
  - name: My Other Data
