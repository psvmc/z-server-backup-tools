name: Release All Platforms

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. 1.0.1)
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-24.04
            platform: linux
          - os: macos-latest
            platform: macos

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install NSIS (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsisDir = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Test-Path (Join-Path $nsisDir 'makensis.exe'))) {
            $nsisDir = Join-Path $env:ProgramFiles 'NSIS'
          }
          if (-not (Test-Path (Join-Path $nsisDir 'makensis.exe'))) {
            Write-Error "makensis.exe not found after NSIS install"
            exit 1
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nsisDir
          & (Join-Path $nsisDir 'makensis.exe') /VERSION

      - name: Install Linux deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev pkg-config build-essential

      - name: Build
        shell: bash
        env:
          INSTALL_SCOPE: user
        run: |
          set -euo pipefail
          ROOT="$(pwd)"
          export PATH="$(go env GOPATH)/bin:$PATH"
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest
          # 勿用 npm --prefix：Windows 上会误找仓库根目录 package.json
          # 勿强依赖 npm ci：@wailsio/runtime 为 latest + Node/npm 版本差异会导致 lock 不同步
          (cd frontend && npm install)
          mkdir -p release dist

          if [ "${{ matrix.platform }}" = "windows" ]; then
            if ! command -v makensis >/dev/null 2>&1; then
              echo "::error::makensis not found in PATH after NSIS install"
              exit 1
            fi
            wails3 task windows:package
            wails3 task build:zipbak-srv-all
            echo "=== dist/ contents ==="
            ls -la dist/ || true
            echo "======================"
            # Git Bash 下 *.exe 通配可能失败，用 find / ls 兜底
            installer="$(find dist -maxdepth 1 -type f -name '*-installer.exe' 2>/dev/null | head -n 1 || true)"
            if [ -z "$installer" ]; then
              installer="$(ls dist/*-installer.exe 2>/dev/null | head -n 1 || true)"
            fi
            if [ -n "$installer" ] && [ -f "$installer" ]; then
              cp -f "$installer" release/
            else
              echo "::error::No installer found in dist/"
              exit 1
            fi
            if [ -f dist/zipbak-srv.exe ]; then
              cp -f dist/zipbak-srv.exe release/zipbak-srv.exe
            else
              echo "::error::zipbak-srv.exe not found in dist/"
              exit 1
            fi
            # Windows/MSYS：同目录不能同时可靠存在 zipbak-srv 与 zipbak-srv.exe
            # （无后缀名会被映射到 .exe，导致 Linux 产物覆盖 Windows exe）。
            # 发布资产使用明确名称 zipbak-srv-linux-amd64。
            if [ -f dist/zipbak-srv ]; then
              cp -f dist/zipbak-srv release/zipbak-srv-linux-amd64
            else
              echo "::error::zipbak-srv (linux) not found in dist/"
              exit 1
            fi
            if [ ! -f release/zipbak-srv-linux-amd64 ]; then
              echo "::error::release/zipbak-srv-linux-amd64 missing after copy"
              ls -la release/ || true
              exit 1
            fi
            if [ ! -f release/zipbak-srv.exe ]; then
              echo "::error::release/zipbak-srv.exe missing after copy"
              ls -la release/ || true
              exit 1
            fi
            # 尺寸应不同：若 linux 覆盖了 exe，两者会变成同一文件
            win_size="$(wc -c < release/zipbak-srv.exe | tr -d ' ')"
            linux_size="$(wc -c < release/zipbak-srv-linux-amd64 | tr -d ' ')"
            echo "zipbak-srv.exe size=${win_size} zipbak-srv-linux-amd64 size=${linux_size}"
            if [ "$win_size" = "$linux_size" ]; then
              echo "::error::Windows/Linux zipbak sizes identical — likely MSYS name collision"
              exit 1
            fi
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            if wails3 task linux:create:deb && wails3 task linux:create:rpm; then
              cp -f dist/*.deb dist/*.rpm release/ 2>/dev/null || true
              if ! ls release/*.deb release/*.rpm 1>/dev/null 2>&1; then
                echo "::error::deb/rpm build succeeded but no packages in release/"
                ls -la dist/ || true
                exit 1
              fi
            else
              wails3 task linux:build
              cp -f dist/ZServerBackup release/ZServerBackup-linux-amd64
            fi
          else
            wails3 task darwin:package:universal
            if [ ! -d "$ROOT/dist/ZServerBackup.app" ]; then
              echo "::error::dist/ZServerBackup.app not found (cwd=$(pwd))"
              ls -la dist/ || true
              exit 1
            fi
            # 用绝对路径 + zip 兜底，避免个别 runner 上 ditto 解析相对路径失败
            if ! ditto -c -k --keepParent "$ROOT/dist/ZServerBackup.app" "$ROOT/release/ZServerBackup-macos-universal.zip"; then
              echo "::warning::ditto failed, falling back to zip"
              (cd "$ROOT/dist" && zip -r "$ROOT/release/ZServerBackup-macos-universal.zip" ZServerBackup.app)
            fi
          fi
          ls -la release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: release/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout for changelog
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog from git tags
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          resolve_tag() {
            local tag="$1"
            for candidate in "$tag" "${tag#v}" "v${tag#v}"; do
              if git rev-parse "refs/tags/${candidate}" >/dev/null 2>&1; then
                echo "$candidate"
                return 0
              fi
            done
            return 1
          }
          CURRENT_TAG="$(resolve_tag "$RELEASE_TAG")" || {
            echo "::error::Tag ${RELEASE_TAG} not found. Push the tag first."
            exit 1
          }
          PREV_TAG="$(git tag -l --sort=-version:refname | awk -v cur="$CURRENT_TAG" '$0==cur {getline; print; exit}')"
          if [ -z "$PREV_TAG" ]; then
            HEADER="## 变更 (${CURRENT_TAG})"
            LOG="- 首个发布版本"
          else
            HEADER="## 变更 (${PREV_TAG} → ${CURRENT_TAG})"
            LOG=$(git log "${PREV_TAG}..${CURRENT_TAG}" --pretty=format:"- %s (%h)" --no-merges)
            [ -z "$LOG" ] && LOG="- 无 commit 变更"
          fi
          { printf '%s\n\n' "$HEADER"; printf '%s\n' "$LOG"; } > release-notes.md

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify release assets before publish
        shell: bash
        run: |
          set -euo pipefail
          echo "=== downloaded artifacts ==="
          ls -la dist/ || true
          test -f dist/zipbak-srv.exe
          test -f dist/zipbak-srv-linux-amd64
          echo "zipbak Windows/Linux assets present"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: main
          name: ZServerBackup ${{ inputs.tag }}
          body_path: release-notes.md
          files: dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
